<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Population Growth (2000–2020)</title>

    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f6f9;
            padding: 40px 20px;
        }

        .table-wrapper {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0px 4px 22px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
            font-size: 28px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 16px;
        }

        thead {
            background: #34495e;
            color: #fff;
        }

        th, td {
            padding: 14px 12px;
            text-align: center;
            border-bottom: 1px solid #e1e4e8;
        }

        tbody tr:hover {
            background: #f9fbfc;
        }

        th {
            font-weight: 600;
        }

        .country {
            text-align: left;
            font-weight: 600;
            color: #2c3e50;
        }
    </style>
</head>
<body>

<div class="table-wrapper">
    <h2>Population Growth (2000–2020)</h2>

    <table>
        <thead>
            <tr>
                <th>Country</th>
                <th>2000 Population (Millions)</th>
                <th>2010 Population (Millions)</th>
                <th>2020 Population (Millions)</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td class="country">Nigeria</td>
                <td>122</td>
                <td>159</td>
                <td>206</td>
            </tr>
            <tr>
                <td class="country">Brazil</td>
                <td>174</td>
                <td>195</td>
                <td>213</td>
            </tr>
            <tr>
                <td class="country">Japan</td>
                <td>127</td>
                <td>128</td>
                <td>126</td>
            </tr>
            <tr>
                <td class="country">Canada</td>
                <td>31</td>
                <td>34</td>
                <td>38</td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
