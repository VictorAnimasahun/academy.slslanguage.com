<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Results — IELTS Mini Mock Test</title>
  <style>
    :root{--pink:#ff5a8a;--blue:#0077cc;--muted:#666;--bg:#f6f7f9;--ok:#1a9a3a;--bad:#c92a2a}
    body{font-family:Inter, "Arial", sans-serif;margin:0;background:var(--bg);color:#222}
    .wrap{max-width:980px;margin:26px auto;padding:20px}
    .card{background:#fff;border-radius:10px;padding:22px;box-shadow:0 6px 18px rgba(12,18,30,0.06)}
    h1{text-align:center;color:var(--blue);margin:0 0 8px}
    .scoreRow{display:flex;gap:12px;justify-content:center;margin-top:12px;flex-wrap:wrap}
    .scoreBox{background:#fbfbfb;border-radius:8px;padding:12px 18px;min-width:180px;text-align:center;border:1px solid #eee}
    .total{font-size:18px;font-weight:800;margin-top:14px;text-align:center}
    .details{margin-top:18px}
    .sectionTitle{font-weight:700;margin-top:12px;color:#222}
    table{width:100%;border-collapse:collapse;margin-top:8px}
    th,td{padding:10px 8px;border-bottom:1px solid #f0f0f0;text-align:left;font-size:14px}
    tr.correct td { background: rgba(26,154,58,0.06); border-left:4px solid var(--ok) }
    tr.wrong td { background: rgba(201,42,42,0.05); border-left:4px solid var(--bad) }
    .user{color:#222}
    .correctAns{color:var(--muted)}
    .controls{display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap}
    .btn{padding:10px 14px;border-radius:8px;border:none;color:#fff;font-weight:700;cursor:pointer}
    .btn-restart{background:linear-gradient(90deg,var(--pink),var(--blue))}
    .btn-back{background:#efefef;color:#222;border:1px solid #e2e2e2}
    .hint{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
    @media (max-width:720px){ .scoreBox{min-width:140px} }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Results</h1>
      <div id="summary" class="scoreRow" aria-live="polite">
        <!-- populated by script -->
      </div>

      <div class="total" id="totalArea"></div>

      <div class="details" id="detailsArea">
        <!-- detailed per-question breakdowns -->
      </div>

      <div class="controls">
        <button class="btn btn-restart" id="restartBtn">Restart Test</button>
        <button class="btn btn-back" id="backToListening">Edit Listening</button>
        <button class="btn btn-back" id="backToReading">Edit Reading</button>
      </div>

      <div class="hint">Answers are compared case-insensitively and punctuation is ignored.</div>
    </div>
  </div>

  <script>
    // Keys the user provided earlier (final correct answers)
    const LISTENING_KEY = ["irrigation","women","wire","seeds","posts","transport","preservation","fish","bees","design"];
    const READING_KEY   = ["temptations","completion","reference","disruption","failings","skills"];

    // helper to normalize answers: lowercase, trim, remove non-letters (keeps a-z)
    function normalizeStr(s){
      return String(s||'').trim().toLowerCase().replace(/[^a-z]/g,'');
    }

    // load stored answers from localStorage
    function loadStored(){
      let listening = [];
      let reading = [];
      try {
        listening = JSON.parse(localStorage.getItem('listeningAnswers') || '[]');
      } catch(e){ listening = []; }
      try {
        reading = JSON.parse(localStorage.getItem('readingAnswers') || '[]');
      } catch(e){ reading = [];}
      return {listening, reading};
    }

    function gradeAndRender(){
      const {listening, reading} = loadStored();

      // grade listening
      let listenScore = 0;
      const listenRows = [];
      for(let i=0;i<LISTENING_KEY.length;i++){
        const userRaw = (listening[i] || '');
        const userNorm = normalizeStr(userRaw);
        const correctNorm = normalizeStr(LISTENING_KEY[i]);
        const ok = userNorm === correctNorm;
        if(ok) listenScore++;
        listenRows.push({num:i+1, user:userRaw || '(empty)', correct: LISTENING_KEY[i], ok});
      }

      // grade reading
      let readScore = 0;
      const readRows = [];
      for(let i=0;i<READING_KEY.length;i++){
        const userRaw = (reading[i] || '');
        const userNorm = normalizeStr(userRaw);
        const correctNorm = normalizeStr(READING_KEY[i]);
        const ok = userNorm === correctNorm;
        if(ok) readScore++;
        readRows.push({num:i+1, user:userRaw || '(empty)', correct: READING_KEY[i], ok});
      }

      // show summary boxes
      const summaryEl = document.getElementById('summary');
      summaryEl.innerHTML = '';
      const box1 = document.createElement('div'); box1.className='scoreBox'; box1.innerHTML = `<div style="font-size:12px;color:var(--muted)">Listening</div><div style="font-size:20px;font-weight:800">${listenScore} / ${LISTENING_KEY.length}</div>`;
      const box2 = document.createElement('div'); box2.className='scoreBox'; box2.innerHTML = `<div style="font-size:12px;color:var(--muted)">Reading</div><div style="font-size:20px;font-weight:800">${readScore} / ${READING_KEY.length}</div>`;
      summaryEl.appendChild(box1); summaryEl.appendChild(box2);

      // total
      const totalEl = document.getElementById('totalArea');
      const total = listenScore + readScore;
      totalEl.innerHTML = `<div>Total score <span style="color:var(--blue);font-weight:800">${total} / ${LISTENING_KEY.length + READING_KEY.length}</span></div>`;

      // detailed breakdown tables
      const details = document.getElementById('detailsArea');
      details.innerHTML = '';

      // Listening details
      const lsTitle = document.createElement('div'); lsTitle.className='sectionTitle'; lsTitle.textContent = 'Listening — question by question';
      details.appendChild(lsTitle);
      const tableL = document.createElement('table');
      tableL.innerHTML = `<thead><tr><th style="width:60px">Q#</th><th>Your answer</th><th>Correct answer</th></tr></thead><tbody></tbody>`;
      const tbodyL = tableL.querySelector('tbody');
      listenRows.forEach(r=>{
        const tr = document.createElement('tr');
        tr.className = r.ok ? 'correct' : 'wrong';
        tr.innerHTML = `<td>${r.num}</td><td class="user">${escapeHtml(r.user)}</td><td class="correctAns">${escapeHtml(r.correct)}</td>`;
        tbodyL.appendChild(tr);
      });
      details.appendChild(tableL);

      // Reading details
      const rdTitle = document.createElement('div'); rdTitle.className='sectionTitle'; rdTitle.textContent = 'Reading — question by question';
      details.appendChild(rdTitle);
      const tableR = document.createElement('table');
      tableR.innerHTML = `<thead><tr><th style="width:60px">Q#</th><th>Your answer</th><th>Correct answer</th></tr></thead><tbody></tbody>`;
      const tbodyR = tableR.querySelector('tbody');
      readRows.forEach(r=>{
        const tr = document.createElement('tr');
        tr.className = r.ok ? 'correct' : 'wrong';
        tr.innerHTML = `<td>${r.num}</td><td class="user">${escapeHtml(r.user)}</td><td class="correctAns">${escapeHtml(r.correct)}</td>`;
        tbodyR.appendChild(tr);
      });
      details.appendChild(tableR);
    }

    // small helper to avoid raw HTML injection
    function escapeHtml(s){
      return String(s)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');
    }

    // Restart test: clear storage and go to listening start
    document.getElementById('restartBtn').addEventListener('click', function(){
      if(confirm('Restart test? This will clear saved answers.')){
        localStorage.removeItem('listeningAnswers');
        localStorage.removeItem('readingAnswers');
        window.location.href = 'listening.html';
      }
    });

    document.getElementById('backToListening').addEventListener('click', function(){
      window.location.href = 'listening.html';
    });
    document.getElementById('backToReading').addEventListener('click', function(){
      window.location.href = 'reading.html';
    });

    // Run grading & render on load
    document.addEventListener('DOMContentLoaded', gradeAndRender);

  </script>
</body>
</html>
