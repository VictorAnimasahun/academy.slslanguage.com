<!DOCTYPE html>
<html>
<head>
    <title>Gemini Audio Transcription Test</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 50px auto; padding: 20px; }
        button { padding: 10px 20px; font-size: 16px; margin: 10px 5px; cursor: pointer; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #status { margin: 20px 0; padding: 10px; background: #f0f0f0; border-radius: 5px; }
        #transcript { margin: 20px 0; padding: 15px; border: 1px solid #ccc; min-height: 100px; border-radius: 5px; }
        .recording { background: #ffcccc !important; }
        .success { background: #ccffcc !important; }
    </style>
</head>
<body>
    <h1>Gemini Audio Transcription Test</h1>
    
    <button id="recordBtn">🎤 Start Recording</button>
    <button id="stopBtn" disabled>⏹️ Stop Recording</button>
    <button id="transcribeBtn" disabled>📝 Transcribe with Gemini</button>
    
    <div id="status">Status: Ready to record</div>
    <div id="transcript">Transcription will appear here...</div>

    <script>
        const recordBtn = document.getElementById('recordBtn');
        const stopBtn = document.getElementById('stopBtn');
        const transcribeBtn = document.getElementById('transcribeBtn');
        const status = document.getElementById('status');
        const transcript = document.getElementById('transcript');

        // REPLACE WITH YOUR ACTUAL API KEY
        const GEMINI_API_KEY = 'AIzaSyBs_jc7z0QZzQdwo41FEQk4myoc2nP1Soc';

        let mediaRecorder;
        let audioChunks = [];
        let audioBlob = null;

        recordBtn.onclick = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    status.textContent = 'Status: Recording saved. Click "Transcribe" to send to Gemini.';
                    status.className = 'success';
                    transcribeBtn.disabled = false;
                    
                    // Stop all tracks
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                status.textContent = 'Status: Recording... Speak now!';
                status.className = 'recording';
                recordBtn.disabled = true;
                stopBtn.disabled = false;
                transcribeBtn.disabled = true;

            } catch (error) {
                status.textContent = 'Error: Could not access microphone - ' + error.message;
            }
        };

        stopBtn.onclick = () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                recordBtn.disabled = false;
                stopBtn.disabled = true;
                status.className = '';
            }
        };

        transcribeBtn.onclick = async () => {
            if (!audioBlob) return;

            status.textContent = 'Status: Sending to Gemini API...';
            transcribeBtn.disabled = true;
            transcript.textContent = 'Processing...';

            try {
                // Convert blob to base64
                const reader = new FileReader();
                reader.readAsDataURL(audioBlob);
                
                reader.onloadend = async () => {
                    const base64Audio = reader.result.split(',')[1];

                    // Call Gemini API
                    const response = await fetch(
                        `https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`,
                        {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{
                                    role: 'user',
                                    parts: [
                                        { text: 'Transcribe this audio accurately. Only output the transcription, nothing else.' },
                                        {
                                            inline_data: {
                                                mime_type: 'audio/webm',
                                                data: base64Audio
                                            }
                                        }
                                    ]
                                }]
                            })
                        }
                    );

                    const data = await response.json();

                    if (response.ok && data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
                        transcript.textContent = data.candidates[0].content.parts[0].text;
                        status.textContent = 'Status: Transcription complete!';
                        status.className = 'success';
                    } else {
                        transcript.textContent = 'Error: ' + JSON.stringify(data, null, 2);
                        status.textContent = 'Status: Transcription failed';
                    }
                    
                    transcribeBtn.disabled = false;
                };

            } catch (error) {
                transcript.textContent = 'Error: ' + error.message;
                status.textContent = 'Status: Error occurred';
                transcribeBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
